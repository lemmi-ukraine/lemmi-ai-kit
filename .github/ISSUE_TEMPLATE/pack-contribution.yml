name: Pack contribution
description: Propose a language- or domain-specific pack of skills
labels: ["pack-contribution"]
body:
  - type: markdown
    attributes:
      value: |
        **The pack path is open. Tell us which language or domain you need.**

        The kit ships a core pack plus sibling language packs, and
        [CONTRIBUTING.md](../../CONTRIBUTING.md) documents how to contribute one:
        where it goes, how it is named, and what this repo does and does not check.
        **There is no pre-merge review bar, so merged does not mean vetted.** Read
        that section before installing anyone's pack, including your own.

        This form is still the most useful thing you can send: the requests filed
        here are the signal that decides which pack gets built next.

  - type: input
    id: pack
    attributes:
      label: Proposed pack name
      placeholder: rust-conventions / terraform / django
    validations:
      required: true

  - type: textarea
    id: contents
    attributes:
      label: What skills would it contain?
      description: A rough list is fine. One line each.
    validations:
      required: true

  - type: textarea
    id: why-separate
    attributes:
      label: Why a separate pack rather than skills in the core set?
      description: |
        Usually the answer is "it only makes sense if you use X". Say what X is, and
        what breaks or misleads if someone without X installs it.
    validations:
      required: true

  - type: textarea
    id: overlap
    attributes:
      label: Does it overlap anything that ships today?
      description: |
        The kit already carries some language-specific conventions skills. Say
        whether yours would duplicate, replace, or sit alongside them.
    validations:
      required: true

  - type: dropdown
    id: maintenance
    attributes:
      label: Would you maintain it?
      description: |
        An unmaintained pack that goes stale is worse than no pack — the whole
        premise of this kit is that stale-but-pretty guidance is a real cost.
      options:
        - Yes, I would maintain it ongoing
        - I would write it, but cannot commit to maintaining it
        - I am only requesting it
    validations:
      required: true
