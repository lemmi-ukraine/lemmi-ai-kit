name: CI

# `pull_request`, NEVER `pull_request_target`. This repository is public and accepts
# skill contributions, which are instructions an agent later executes; a fork PR is
# therefore untrusted input twice over. `pull_request` runs the fork's code with a
# read-only token and no access to repository secrets. `pull_request_target` would run
# it with the BASE repository's token and secrets in scope, which turns "edit a
# markdown file" into "exfiltrate every secret this repo has". Do not change this line
# to make a fork PR see a secret -- there is no secret a fork PR should see.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege at the top level, inherited by every job. Without this block the
# workflow gets the repository default, which can be read/write on contents, issues and
# packages -- authority no check here needs, handed to whatever a PR causes to run.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Every step below imports the package, and the package lives INSIDE the plugin
      # payload -- so without this, running the checks writes __pycache__ into the tree
      # `publish-check` measures, and that step fails on files CI itself created. Set
      # once at job level rather than per step: the trap is that it only has to be
      # missing from one of them.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # Actions are pinned to a commit SHA, not a tag. A tag is mutable: whoever can
      # move `v4` can run their code in this workflow. The trailing comment records
      # which release the SHA was, since the SHA alone is unreadable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (basedpyright)
        run: uv run basedpyright

      - name: Tests (pytest)
        run: uv run pytest

      # A FIFTH gate, and it is not covered by any of the four above. Its 500-line skill
      # cap fires on ordinary SKILL.md edits, and several shipped skills sit within a
      # couple of lines of it -- so a routine content change can cross it while ruff,
      # ruff format, basedpyright and pytest all stay green. That happened on 2026-08-31:
      # two skills went 499 -> 512 and 493 -> 518 in one change, and only a hand-run of
      # this command caught it. `--fail-on major` is the level section 7 specifies: minor
      # findings are review input, and gating on them makes the suite brittle.
      - name: Skill audit (audit-skills)
        run: uv run python -B -m lemmi_ai_kit audit-skills --fail-on major

      # A SIXTH gate. AGENTS.md requires this before anything an adopter consumes, and
      # until now nothing ran it automatically -- it was caught by hand, having blocked
      # on three probes at once. In CI its working-tree and untracked probes are
      # normally trivial, and that is the point: the one it earns its place on is the
      # gitignored-in-payload probe, because a plugin install copies the payload
      # directory rather than the git tree, so anything .gitignore hides still ships.
      #
      # Exit 2 means could-not-measure, which is not a pass -- gating on `!= 0` rather
      # than on a specific code is deliberate.
      - name: Publish check (payload matches the git tree)
        run: uv run python -B -m lemmi_ai_kit publish-check

      # Charter DoD 5: the drift check ships as a non-blocking report and is promoted to
      # a gate only once it has been observed to be accurate. See the promotion criteria
      # in docs/syncing-from-upstream.md section 7.
      #
      # The upstream repository is private and is not present here, so this normally
      # prints "NOT MEASURED". That line is the point: it makes the absence visible
      # rather than silent, and everything measurable without upstream -- the record's
      # validity, its correspondence with the shipped pack, and the measurement
      # arithmetic itself -- is already gated by pytest above.
      #
      # `continue-on-error` rather than relying on the script's exit code: the script
      # returns 0 on every path by contract, so this only tolerates the script itself
      # crashing, and it surfaces such a crash in the UI instead of hiding it.
      - name: Upstream drift report (non-blocking)
        continue-on-error: true
        run: uv run python tests/upstream_sync.py
