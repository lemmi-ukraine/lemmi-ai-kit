# --------------------------------------------------------------------------------------
# Upstream skills deliberately not shipped.
#
# This half of the map is what lets the drift report distinguish "upstream added a skill
# we have not noticed" from "upstream has a skill we decided against". Without it every
# sync re-litigates all seven. A new upstream directory in neither table is reported as
# undeclared — that is the addition signal.

[[unported]]
