# Recorded upstream sync point for the skill pack.
#
# The pack was extracted from a private source project once and refreshed once. This
# file is the machine-readable record of *what it was refreshed from*, so that "how far
# behind upstream are we?" is a command (see syncing-from-upstream.md) instead of an
# audit. `tests/upstream_sync.py` reads it; `tests/test_upstream_sync.py` gates its
# internal consistency on every run.
#
# Three things this file deliberately does NOT record:
#
# 1. **The upstream repository's name or location.** It is private, and the hygiene
#    contract bans naming it in a tracked file. The drift check takes the path from
#    `--repo` or `$LEMMI_UPSTREAM_REPO`. Committed here: opaque SHAs only.
# 2. **Word or line counts.** They go stale the moment upstream commits. The check
#    measures; this file only says what to measure against.
# 3. **A content hash per skill.** The refresh dropped 82 upstream lines on purpose
#    (banned patterns, unshipped infrastructure, unreachable pointers, machine-specific
#    rules). A content check would report every one of them as drift, forever. Drift is
#    counted in *upstream commits touching a skill's directory since its base* — which
#    is zero the moment a sync lands, and stays zero until upstream actually moves.

# --------------------------------------------------------------------------------------
# CARRIED 2026-08-31, PIN DELIBERATELY NOT MOVED.
#
# The whole of upstream's skills-tree advance since `upstream_commit` arrived in ONE unmerged
# pull request. Measured at the time: 8 commits touch the skills tree between the pin and that
# PR's head `a0fa9872e3d8bbcd265983f72c24ea8f16f4c8d3`, and ZERO of them come from anywhere
# else -- so that PR was the entire backlog. Its content has been carried (17 skills plus the
# stacked-PR asset); two new upstream skills were declined and put in [[unported]] below (one of
# them, `metric-validity-check`, was carried 2026-09-14 -- see its [[skills]] row).
#
# The pin stays where it is ON PURPOSE. That SHA is the head of an OPEN branch: a rebase,
# amend or squash-merge rewrites it, and a pin naming a commit upstream no longer has is
# unresolvable -- the drift check would measure nothing and say so badly. Leaving the pin
# produces the opposite error: the report keeps listing those skills as BEHIND when their
# content is already here. That is a LOUD false positive, which a maintainer investigates,
# rather than a silent false negative, which nobody ever does. Same trade this record makes
# for `session-retrospective` in the syncing guide.
#
# WHOEVER SEES THAT PR MERGE: move `upstream_commit` to the merge commit, refresh `synced_on`,
# delete this block, and re-run the report. It should go clean for every skill named above.

[sync]
# The upstream revision observed at the sync point. Authoritative for the drift check:
# anything touching the skills tree after this commit is drift.
upstream_commit = "a78ee5af7c52fa4058bb84109fa3c2412f63c7f5"

# The last commit at or before `upstream_commit` that actually touched the skills tree.
# Informational: there are zero skill-touching commits between the two, so the skills
# content at `upstream_commit` is exactly this commit's. Recorded because it is the
# honest answer to "when did the content we hold last change upstream?" — 2026-08-20,
# not 2026-08-22.
upstream_skills_commit = "2e9737bd6637ccd3fe3752aff7a19f51b4775014"

# Upstream's skills tree as this repo actually received it: the last skills-touching
# upstream commit BEFORE the kit's first commit (upstream 2026-06-25T21:39, kit
# 2026-07-02T23:26). This is the merge base for any skill not refreshed since
# extraction, and the reason a two-way kit-vs-upstream diff is the wrong instrument:
# the two repos share no git history, so in a two-way diff an upstream advance and a
# deliberate extraction edit are the same shape. Compare three-way against this.
#
# NOT `c05bf72d` (2026-07-06), which earlier work used. That commit is four days INSIDE
# the extraction window, so three upstream commits land between the two. See
# [extraction_window] below -- getting this wrong does not merely mis-measure, it
# reclassifies upstream content as a deliberate kit deletion.
extraction_base = "3dd2496d874552d6acaac3de6095abc4ec68c2b0"

# Where skills live inside the upstream tree.
skills_path = ".claude/skills"

synced_on = "2026-08-23"

# Printed by the drift check, directly above its BEHIND list. It exists because the note
# that used to live in the comment block above is invisible to the loader and to anyone
# running the report -- the mitigation has to reach the surface where the problem appears.
carried_note = """2026-08-31: every BEHIND skill below has ALREADY been carried. Do not re-port them.
The whole advance came from ONE open upstream pull request; its head SHA would be
rewritten by a rebase or squash-merge, so pinning it would leave the pin unresolvable
and the check measuring nothing. The pin is held instead, which costs this loud false
positive. Verify before acting: `git diff --numstat <pin>..<ref> -- <skill dir>`.
When that PR merges: move upstream_commit to the merge commit, refresh synced_on,
delete this note and the CARRIED block above, then re-run."""

# --------------------------------------------------------------------------------------
# The extraction window is not a point, and one earlier base got this wrong.
#
# This repo's first commit is 2026-07-02 and its last extraction-era commit 2026-07-09.
# The 2026-08-23 refresh used `c05bf72d` (2026-07-06) as the three-way base for every
# skill -- four days inside that window. Three upstream commits touch the skills tree in
# the gap between `extraction_base` and that commit, adding 2,668 insertions across 16
# skill directories. 1,024 of those are the two linters and their tests, which this kit
# deliberately does not ship -- leaving exactly 1,644 insertions of skill content.
#
# Why that is worse than a mis-measurement: the refresh's own classification rule reads
# "present at base, absent in ours, present in theirs" as a deliberate kit deletion --
# KEEP IT DELETED. Content upstream added inside the window is present at `c05bf72d`, so
# every line of it was eligible to be classified that way and dropped silently.
#
# Measured, not inferred: all 19 window-added lines of `skill-researcher/SKILL.md` are
# absent from the shipped file, and that skill reports ZERO drift against the pin. Some
# of those lines are correctly absent (they carry source-project rules), which is exactly
# why this needs a per-skill read rather than a bulk re-merge.
#
# `affected` lists UPSTREAM directory names, so the drift check resolves them through the
# correspondence map and picks up the renames. Recorded rather than computed so the debt
# is visible without an upstream checkout; the check re-measures it and reports a
# mismatch if this list is wrong.

# REVIEWED 2026-08-24. What was carried, since the table stays rather than being deleted:
#
# All 16 affected directories are settled. Seven were paid by the W-window (carriage 11% ->
# 84%); two no longer ship (`openai-realtime-quirks` dropped by OQ-2, `prompt-engineering-
# conventions` removed by D1); the remaining seven were measured line by line and every
# window-added line given an explicit RECOVER / REPOINT / SUPERSEDED / CORRECTLY-ABSENT
# verdict across four sessions. Records: docs/research/2026-08-24-extraction-window-
# {remainder-measured,batch-core,test-conventions}.md.
#
# Measured before and after, same probe, whole shipped directory per skill:
#   829 window-added lines | 737 present -> 776 present | 92 absent -> 53 absent | 89% -> 94%
#
# The residual 53 are NOT unexamined. They are: lines the kit deliberately strips (unshipped
# linters, hard-coded skill-script paths, machine-specific rules, source-project layout,
# dated citations); lines the kit is AHEAD on, where it inserted text mid-line so an exact
# match fails; and lines recovered in generalised form, which a substring probe still counts
# as absent. That last class is why the percentage understates the work and why 53 is a
# ceiling rather than a debt.
#
# The proof case is closed: `skill-researcher` was 19 window lines with ZERO shipped and zero
# drift reported. It is now 14 of 19, and the five that remain were reworded on purpose.
[extraction_window]
kit_first_commit = "kit:002daddec7d7ec394b057d82670e061726ec47a9"
base_used_by_refresh = "c05bf72df02c4cb808dab1305bcd294939eb4ae0"
status = "reviewed-2026-08-24"
affected = [
  "ai-changelog",
  "ai-docs-lookup",
  "ai-improvement-tracker",
  "hypothesis-validator",
  "learning-consolidator",
  "lemmi-python-conventions",
  "lemmi-test-conventions",
  "openai-realtime-quirks",
  "prompt-engineering-conventions",
  "session-retrospective",
  "skill-content-reviewer",
  "skill-creation-workflow",
  "skill-creator",
  "skill-researcher",
  "skill-reviewer",
  "task-learnings",
]

# --------------------------------------------------------------------------------------
# Correspondence map.
#
# One row per shipped skill; `tests/test_upstream_sync.py` fails if that stops being
# true, which is what keeps this table from rotting into decoration.
#
# `name`      — the directory under the shipped skills tree.
# `upstream`  — the directory under `skills_path` upstream. EMPTY means no upstream
#               counterpart exists; such a row must be `kit-origin`.
# `direction` — provenance, not "has it diverged". Every carried skill has some kit-side
#               divergence (that is what the hygiene contract is for), so a field meaning
#               "differs" would be a column of one value. This field means *which side
#               authored it*, because that is what changes the sync action:
#
#     upstream-origin  Authored upstream; this repo's copy descends from it. New upstream
#                      content is a backlog to port. The default.
#     kit-origin       Authored HERE; upstream's copy descends from this repo. Upstream's
#                      later edits are contributions to review, not a backlog to absorb.
#                      A check that assumes upstream-is-newer reports these backwards.
#                      Must cite `upstream_adopted` — the claim has to be falsifiable.
#     divergent-both   Both lineages moved in ways that make a mechanical three-way merge
#                      unsafe, measured, not suspected. Must carry `base` and `note`.
#
# `base`      — the ref whose content is the base for this skill's NEXT three-way merge.
#               Defaults to `sync.upstream_commit`; present only where that is untrue.
# `upstream_adopted` — for kit-origin rows: the upstream commit that received the copy.
# `origin`    — for kit-origin rows: `kit:<sha>`, this repo's own first version. Prefixed
#               because it is a commit in a DIFFERENT repository from every other SHA
#               here, and an unprefixed one would be silently unresolvable.

