[project]
name = "lemmi-ai-kit"
version = "0.1.0"
description = "Deploy Lemmi's shared AI configuration (Claude Code skills, AGENTS.md/CLAUDE.md, .ai scaffolding) into any project"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Andrii Shafar", email = "andrii.shafar@lemmi.io" }]
dependencies = []

[project.scripts]
lemmi-ai-kit = "lemmi_ai_kit.cli:main"

[dependency-groups]
dev = [
  "basedpyright>=1.29",
  "pytest>=8",
  "ruff==0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lemmi_ai_kit"]

[tool.ruff]
src = ["src"]
target-version = "py311"
extend-exclude = ["src/lemmi_ai_kit/assets"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "UP",
  "B",
  "SIM",
  "I",
]
ignore = ["E501"]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["src/lemmi_ai_kit/assets"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = "warning"
