[project]
name = "lemmi-ai-kit"
version = "0.1.0"
description = "Lemmi's shared AI configuration as a Claude Code and Codex plugin, plus the support scripting the plugin's kit-setup skill uses to scaffold project files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lemmi-ukraine" }]
dependencies = []

[project.urls]
Repository = "https://github.com/lemmi-ukraine/lemmi-ai-kit"

[project.scripts]
lemmi-ai-kit = "lemmi_ai_kit.cli:main"

[dependency-groups]
dev = [
  "basedpyright>=1.29",
  "pytest>=8",
  "ruff==0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plugins/core/src/lemmi_ai_kit"]

[tool.ruff]
src = ["plugins/core/src"]
target-version = "py311"
extend-exclude = ["plugins/core/src/lemmi_ai_kit/assets", "plugins/core/skills", "plugins/python/skills"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "UP",
  "B",
  "SIM",
  "I",
]
ignore = ["E501"]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["plugins/core/src", "tests"]
exclude = ["plugins/core/src/lemmi_ai_kit/assets", "plugins/core/skills", "plugins/python/skills"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = "warning"
